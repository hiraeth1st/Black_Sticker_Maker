name: Publish stable release
on:
  workflow_run:
    workflows: [Android APK]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publish-stable
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify release version and current source
        run: |
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$SOURCE_SHA"
          python - <<'CHECK'
          from pathlib import Path
          assert "versionName '1.0.0'" in Path('app/build.gradle').read_text()
          CHECK
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: Sticker-Atolyesi-Release-APK
          path: package
      - name: Publish verified APK
        run: |
          mv package/app-release.apk package/black-sticker-maker-1.0.0.apk
          (cd package && sha256sum black-sticker-maker-1.0.0.apk > SHA256SUMS.txt)
          cp RELEASE_NOTES.md release-notes.md
          printf '\nKaynak: %s\nTestler: https://github.com/%s/actions/runs/%s\n' "$SOURCE_SHA" "$GH_REPO" "$RUN_ID" >> release-notes.md
          gh release create v1.0.0 --target "$SOURCE_SHA" --title 'Black Sticker Maker 1.0.0' --notes-file release-notes.md --draft package/black-sticker-maker-1.0.0.apk package/SHA256SUMS.txt
          gh release edit v1.0.0 --draft=false --prerelease=false --latest
